<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>tl 划词翻译设置</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main class="card">
      <h1>tl 划词翻译</h1>
      <p class="intro">使用 OpenAI-compatible Chat Completions 接口。默认配置与 tl CLI 当前配置一致。</p>

      <form id="settings-form">
        <label>
          <span>Base URL</span>
          <input id="base-url" name="baseUrl" type="url" required placeholder="https://api.example.com/v1">
        </label>

        <label>
          <span>API Key</span>
          <input id="api-key" name="apiKey" type="password" required autocomplete="off" placeholder="输入 API Key">
        </label>

        <label>
          <span>Model</span>
          <input id="model" name="model" type="text" required placeholder="Qwen3.5-9B">
        </label>

        <label>
          <span>Timeout（秒）</span>
          <input id="timeout" name="timeout" type="number" min="1" max="600" step="1" required>
        </label>

        <label class="checkbox-row">
          <input id="enable-thinking" name="enableThinking" type="checkbox">
          <span>启用思考模式</span>
        </label>
        <p class="hint">翻译建议关闭。关闭后请求会发送 <code>enable_thinking: false</code>。</p>

        <div class="actions">
          <button id="save" type="submit">保存设置</button>
          <span id="status" role="status" aria-live="polite"></span>
        </div>
      </form>

      <p class="note">API Key 只保存在 Firefox 扩展本地存储中，不会写入网页或项目源码。</p>
    </main>
    <script src="defaults.js"></script>
    <script src="options.js"></script>
  </body>
</html>
